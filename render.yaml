services:
  # ── FastAPI backend ────────────────────────────────────────────────────────
  - type: web
    name: structura-api
    runtime: python
    region: singapore         # change to: oregon | frankfurt | ohio | virginia
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: MODEL_PROVIDER
        value: none              # set to openai_compatible if you have a key
      - key: MODEL_BASE_URL
        value: ""
      - key: MODEL_API_KEY
        value: ""
      - key: MODEL_NAME
        value: ""
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: ""

  # ── Next.js frontend ────────────────────────────────────────────────────────
  - type: web
    name: structura-web
    runtime: node
    region: singapore
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: structura-api
          type: web
          property: host
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
